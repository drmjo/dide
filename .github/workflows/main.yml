name: Build All

on: [push]

jobs:
  helm:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build helm ${{ matrix.version }}
      uses: ./.github/actions/build
      with:
        app: helm
        version: 3.15.1
        sha: 7b20e7791c04ea71e7fe0cbe11f1a8be4a55a692898b57d9db28f3b0c1d52f11

  terragrunt:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build terragrunt ${{ matrix.version }}
      uses: ./.github/actions/build
      with:
        app: terragrunt
        version: 0.58.14
        sha: 2abc9c2729a9a16c5672c3db71b333381d25fa44a978bba86dab2c0b3246b4de

  kubectl:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    strategy:
      matrix:
        include:
          - version: 1.33.0
            sha: 9efe8d3facb23e1618cba36fb1c4e15ac9dc3ed5a2c2e18109e4a66b2bac12dc
          - version: 1.32.3
            sha: 8906b3f320e55523ca3b77e892e6b60644c31e57c1932a160b0f32144f442e24
          - version: 1.31.5
            sha: 7e73f9cd2bc66e5f3b44b5f02fe06954cd2cd28a2963534acb91ed35502cba08
          - version: 1.30.2
            sha: c51590af30346dd613cc86e1aeae5e6889beb34a46cf851225303832951c525c
          - version: 1.29.6
            sha: 51acf09b122cb27d7b0935279164970c6e744d957de0d8b7d31a996b8c8623c0
          - version: 1.28.11
            sha: 6e44c0eed0a194bc50730e4f7e50b54896d93c512f357d7eba56f96df0c14ef5
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build kubectl
      uses: ./.github/actions/build
      with:
        app: kubectl
        version: ${{ matrix.version }}
        sha: ${{ matrix.sha }}

  awscli:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build awscli ${{ matrix.version }}
      uses: ./.github/actions/build
      with:
        app: awscli
        version: 2.28.14
        sha: 2bc0f156ca5beeba3f7a0d50a741c5f666235f618d7ffee3b6c3cbce1730b3c6

  eks:
    needs: awscli
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    strategy:
      matrix:
        include:
          - version: "1.33"
          - version: "1.32"
          - version: "1.31"
          - version: "1.30"
          - version: "1.29"
          - version: "1.28"
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build eks
      uses: ./.github/actions/build
      with:
        app: eks
        version: ${{ matrix.version }}

  base:
    needs: awscli
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build base
      uses: ./.github/actions/build
      with:
        app: base
        version: 2.16

  ide:
    needs: base
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    strategy:
      matrix:
        include:
          - version: "1.33"
          - version: "1.32"
          - version: "1.31"
          - version: "1.30"
          - version: "1.29"
          - version: "1.28"
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build ide
      uses: ./.github/actions/build
      with:
        app: ide
        version: ${{ matrix.version }}
