name: Build All

on: [push]

env:
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build helm ${{ matrix.version }}
      uses: ./.github/actions/build
      with:
        app: helm
        version: 3.20.0
        sha: dbb4c8fc8e19d159d1a63dda8db655f9ffa4aac1b9a6b188b34a40957119b286

  terragrunt:
    runs-on: ubuntu-latest
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build terragrunt ${{ matrix.version }}
      uses: ./.github/actions/build
      with:
        app: terragrunt
        version: 0.99.4
        sha: 97d2c54a657f8a3afcf96f4dd5d9d3b9a0df1fe28a95345289e45eb340e93856

  packer:
    runs-on: ubuntu-latest
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build packer ${{ matrix.version }}
      uses: ./.github/actions/build
      with:
        app: packer
        version: 1.15.0
        sha: 2fd1149c5c6c7604ced64d7b56638af05f6b7ed3f6835182bc913ddaba1f16b8

  kubectl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: 1.36.1
            sha: 629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7
          - version: 1.35.5
            sha: 90f75ea6ecc9ea5633262e1c0b83a40560003b30fc94a04cb099404fcef0c224
          - version: 1.34.8
            sha: f6249132865c13abe3c9dd5038f5da65849cb86eee1608c001831504e481aa8c
          - version: 1.33.12
            sha: fe80ae4133b44fa2077db4af144e80765eb1b3b2eede55fbff6933c4374d8c6e
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build kubectl
      uses: ./.github/actions/build
      with:
        app: kubectl
        version: ${{ matrix.version }}
        sha: ${{ matrix.sha }}

  awscli:
    runs-on: ubuntu-latest
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build awscli ${{ matrix.version }}
      uses: ./.github/actions/build
      with:
        app: awscli
        version: 2.34.56
        sha: 5c0461b1e95249d4ce71b2f606b0636708285710796ce8e45ac590de26d3ba75

  eks:
    needs: awscli
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: "1.36"
          - version: "1.35"
          - version: "1.34"
          - version: "1.33"
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build eks
      uses: ./.github/actions/build
      with:
        app: eks
        version: ${{ matrix.version }}

  base:
    needs: awscli
    runs-on: ubuntu-latest
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build base
      uses: ./.github/actions/build
      with:
        app: base
        version: 2.28

  ide:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: "1.35"
          - version: "1.34"
          - version: "1.33"
          - version: "1.32"
          - version: "1.31"
          - version: "1.30"
          - version: "1.29"
          - version: "1.28"
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build ide
      uses: ./.github/actions/build
      with:
        app: ide
        version: ${{ matrix.version }}
  didegithubrunner:
    needs: ide
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: "1.35"
          - version: "1.34"
          - version: "1.33"
          - version: "1.32"
          - version: "1.31"
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build didegithubrunner
      uses: ./.github/actions/build
      with:
        app: didegithubrunner
        version: ${{ matrix.version }}
